
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: java
      MYSQL_DATABASE: java
      MYSQL_USER: java
      MYSQL_PASSWORD: java
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app-network

  app:
    build: .
    container_name: spring_app
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.dev
    ports:
      - "80:8080"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge