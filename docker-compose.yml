
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: java
      MYSQL_DATABASE: java
      MYSQL_USER: java
      MYSQL_PASSWORD: java
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql

  app:
    build: .
    container_name: spring_app
    depends_on:
      - mysql
    env_file:
      - .env.dev
    ports:
      - "80:80"