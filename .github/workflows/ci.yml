name: CI

on:
  # Ejecuta la acción en cada push y en cada pull-request
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  # Forzamos perfil “test” para que Spring use H2 y configuración de pruebas
  SPRING_PROFILES_ACTIVE: test

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test

      SPRING_APPLICATION_NAME: SpringDocker
      SERVER_PORT: 8080
      JWT_SECRET_KEY: dummy-test-key
      JWT_EXPIRATION_TIME: 86400000

      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect
      SPRING_JPA_SHOW_SQL: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run unit & integration tests
        run: mvn --batch-mode verify
